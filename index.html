<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마을회관 유사도 게임</title>
<meta name="description" content="마을회관 유사도 게임: 각자 폰으로 참여해, 출제자가 봉투 속 명사 하나를 숨기고 유사도 95% 이상 힌트로 맞히게 하는 파티 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one stage column (game) + a narrow scoreboard rail; stacks on phones. Single dark "studio" look by choice. */
:root{
  --bg:#13111b; --panel:#1c1928; --panel2:#242036; --line:#352f4b;
  --fg:#efebf7; --muted:#a19abb; --brass:#e0ac4f; --cold:#62c6c0; --hot:#ef6a5e; --paper:#e9dcc0; --paperInk:#3a2c14; --ok:#7bd88f;
  --display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
[hidden]{display:none!important}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr);max-width:640px}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
header{max-width:1040px;margin:0 auto 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);margin:0;letter-spacing:.5px;line-height:1}
h1 b{color:var(--brass);font-weight:400}
.tag{color:var(--muted);font-size:13px}
.stage,.rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0}
.rail{position:sticky;top:12px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:700}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--brass);letter-spacing:.08em;margin-bottom:6px}
form{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
input[type=text]{flex:1 1 200px;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;font-size:17px}
input.code-in{text-transform:uppercase;font-family:var(--mono);letter-spacing:.2em;flex:0 1 140px}
input:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button{font:inherit;font-weight:700;border-radius:10px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
button.go{background:var(--brass);border-color:var(--brass);color:#1b1408}
button.go:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.small{padding:6px 10px;font-size:13px;font-weight:500}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card form{margin-top:10px}
.bigcode{font-family:var(--mono);font-size:clamp(34px,8vw,48px);letter-spacing:.25em;color:var(--brass);font-weight:700;line-height:1.1}
.invite{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.invite input{font-size:13px;font-family:var(--mono)}
.list{display:grid;gap:6px;margin-top:8px}
.list div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;background:var(--panel2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px;vertical-align:1px}
.dot.off{background:var(--line)}
.opts label{display:flex;gap:10px;align-items:center}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--hot) 14%,transparent);border:1px solid color-mix(in srgb,var(--hot) 40%,transparent)}
.ok{margin-top:12px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--brass) 14%,transparent);border:1px solid color-mix(in srgb,var(--brass) 45%,transparent)}
.note{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);color:var(--muted);font-size:13px}
.wait{padding:22px 4px;text-align:center}
.wait .who{font-family:var(--display);font-size:clamp(28px,6vw,40px);color:var(--brass);line-height:1.1;margin:6px 0 8px}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hint{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.hint small{font-family:var(--mono);color:var(--brass);margin-right:6px;font-weight:500}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--brass)}
.steps span.miss{background:var(--cold)}
.steps span.hit{background:var(--hot)}
table{width:100%;border-collapse:collapse;font-size:14px}
.tablebox{overflow-x:auto}
td,th{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;width:60px}
.meter{position:relative;height:10px;border-radius:5px;background:var(--bg);min-width:90px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--cold)}
.meter i.warm{background:var(--brass)}
.meter i.hit{background:var(--hot)}
.meter em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.55}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--hot);color:#1d0b09;margin-left:6px}
.reveal{font-family:var(--display);font-size:clamp(40px,9vw,72px);color:var(--brass);line-height:1;margin:6px 0 14px;word-break:keep-all}
.board{display:grid;gap:6px}
.board div{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:9px;background:var(--panel2);align-items:center}
.board div.setter{outline:1px solid var(--brass)}
.board div.me{background:color-mix(in srgb,var(--brass) 10%,var(--panel2))}
.board b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.board .role{font-size:11px;color:var(--brass);margin-left:6px}
.delta{color:var(--brass);font-family:var(--mono);font-size:13px}
.rules{font-size:13px}
.rules td:last-child{font-family:var(--mono);text-align:right;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip.done{color:var(--fg);border-color:var(--ok)}
/* envelopes */
.envs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin-top:12px}
.env{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--paper);color:var(--paperInk);border:none;padding:0;overflow:hidden;font-family:var(--display);font-size:26px;font-weight:400;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10%;transition:transform .15s}
.env::before{content:"";position:absolute;inset:0 0 auto 0;height:58%;background:color-mix(in srgb,var(--paper) 82%,#000);clip-path:polygon(0 0,100% 0,50% 100%)}
.env::after{content:"";position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-14px 0 0 -10px;border-radius:50%;background:var(--hot)}
.env span{position:relative;z-index:1}
.env:hover:not(:disabled){transform:translateY(-3px)}
.env:disabled{cursor:default}
.env.used{opacity:.28}
.env.used::after{display:none}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.words button{font-family:var(--display);font-weight:400;font-size:24px;padding:18px 10px;background:var(--paper);color:var(--paperInk);border:none}
.load{margin-top:14px;font-size:13px;color:var(--muted)}
.load .bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;margin-top:6px}
.load .bar i{display:block;height:100%;background:var(--cold);width:0;transition:width .2s}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:sp .9s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}.env{transition:none}}
footer{max-width:1040px;margin:20px auto 0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <h1>마을회관 <b>유사도</b> 게임</h1>
  <span class="tag">출제자는 95% 힌트로 버티고, 나머지는 히든 워드를 정확히 맞힌다</span>
</header>
<div class="wrap" id="wrap">
  <main class="stage" id="stage"></main>
  <aside class="rail" id="rail"></aside>
</div>
<footer>각자 폰으로 접속해 참여해요. 방장 기기가 게임을 진행하고 유사도를 계산하니 방장은 창을 닫지 마세요. 유사도는 Gemini로 계산해요.</footer>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
/* ================= similarity engine (host only) ================= */
const MODEL = 'Xenova/paraphrase-multilingual-MiniLM-L12-v2';
const engine = {ready:false, failed:false, pct:0, extractor:null, promise:null, api:false};
/* Gemini embeddings through our Cloudflare Worker (keeps the API key off this page). Empty → local model only. */
const SIM_API = 'https://wispy-art-2b04.moil-art-alert.workers.dev';
let apiDownUntil = 0;
async function apiCheck(){
  try {
    const j = await (await fetch(SIM_API)).json();
    if (!j.ok || !j.key) throw new Error('worker not ready');
    engine.api = true; engine.ready = true; engine.failed = false; engine.pct = 100; enginePing(true);
  } catch(e){ console.error(e); loadEngine().catch(() => {}); }
}
async function apiEmbedMany(list){
  const keys = list.map(t => t.trim());
  const need = [...new Set(keys)].filter(k => !embCache.has('g:' + k));
  for (let i = 0; i < need.length; i += 16){
    const r = await fetch(SIM_API, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({texts:need.slice(i, i + 16)})});
    if (!r.ok) throw new Error('api ' + r.status + ' ' + (await r.text()).slice(0, 200));
    (await r.json()).vectors.forEach((v, j) => embCache.set('g:' + need[i + j], v));
  }
  return keys.map(k => embCache.get('g:' + k));
}
const dot = (x, y) => { let s = 0; for (let i = 0; i < x.length; i++) s += x[i] * y[i]; return s; };
/* one target per meaning, so a hint for any meaning of a homonym is judged on that meaning */
const senseText = (w, g) => `${w}: ${g.slice(0, 4).join(', ')}`;
/* Gemini cosines all sit around 0.8–0.95, and some targets score high with everything.
   So each target's score is measured above its own baseline (mean similarity to unrelated anchor words).
   Calibrated 2026-11-26: unrelated ≈ 0, weak link ≈ 0.05, strong hint ≥ 0.10 (배-항해 0.09, 배-선박 0.15, 기차-철도 0.13). */
const ANCHORS = ['연필', '냉장고', '구름', '양말', '피아노', '수학', '고양이', '신호등', '라디오', '계단', '치약', '우주'];
const CUT_G = 0.10;
const baseCache = new Map();
async function baseline(t, tv){
  if (baseCache.has(t)) return baseCache.get(t);
  const av = await apiEmbedMany(ANCHORS);
  const b = av.reduce((s, v) => s + dot(v, tv), 0) / av.length;
  baseCache.set(t, b);
  return b;
}
function toPctG(adj){
  const p = adj <= CUT_G ? Math.max(0, adj) / CUT_G * 95 : 95 + (adj - CUT_G) / 0.08 * 5;
  return Math.max(0, Math.min(99, Math.floor(p)));
}
const embCache = new Map();
function loadEngine(){
  if (engine.promise) return engine.promise;
  engine.failed = false;
  engine.promise = (async () => {
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1');
    env.allowLocalModels = false;
    const files = {};
    engine.extractor = await pipeline('feature-extraction', MODEL, {
      dtype: 'q8',
      progress_callback: p => {
        if (p.status === 'progress' && p.total){ files[p.file] = [p.loaded, p.total];
          let a = 0, b = 0; for (const [l, t] of Object.values(files)){ a += l; b += t; }
          const pct = Math.round(a / b * 100); if (pct !== engine.pct){ engine.pct = pct; enginePing(); } }
      }
    });
    engine.ready = true; engine.pct = 100; enginePing(true);
  })().catch(e => { console.error(e); engine.failed = true; engine.promise = null; enginePing(true); throw e; });
  return engine.promise;
}
let pingTimer = null;
function enginePing(now){
  if (mode !== 'host') return;
  if (now){ clearTimeout(pingTimer); pingTimer = null; return push(); }
  if (!pingTimer) pingTimer = setTimeout(() => { pingTimer = null; push(); }, 700);
}
async function embed(w){
  const k = w.trim();
  if (embCache.has(k)) return embCache.get(k);
  await loadEngine();
  const v = (await engine.extractor(k, {pooling:'mean', normalize:true})).data;
  embCache.set(k, v);
  return v;
}
/* raw cosine → game %. Calibrated on Korean noun pairs: 0.75 raw (기차-철도, 치킨-닭, 커피-카페 급) = 95%. */
const CUT = 0.75;
function toPct(raw){
  if (raw >= 0.999) return 100;
  const p = raw <= CUT ? raw / CUT * 95 : 95 + (raw - CUT) / (1 - CUT) * 5;
  return Math.max(0, Math.min(99, Math.floor(p)));
}
const hashPick = (str, n) => { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % n; };
async function similarity(a, b){
  if (norm(a) === norm(b)) return 100;
  const d = SENSE_DICT[a];
  if (d){
    const nb = norm(b);
    if (d.s.some(g => g.some(x => norm(x) === nb))) return 95 + hashPick(nb, 5);   // strong hint for one of the meanings
    if (d.n.some(x => norm(x) === nb)) return 85 + hashPick(nb, 9);                // related, but not enough
  }
  if (SIM_API && Date.now() > apiDownUntil){
    try {
      const targets = [a, ...(d ? d.s.map(g => senseText(a, g)) : [])];
      const [hv, ...tv] = await apiEmbedMany([b, ...targets]);
      let best = -1;
      for (let i = 0; i < tv.length; i++) best = Math.max(best, dot(hv, tv[i]) - await baseline(targets[i], tv[i]));
      return toPctG(best);
    } catch(e){ console.error(e); apiDownUntil = Date.now() + 60000; }
  }
  /* fallback: small local model, capped below the pass line for envelope words */
  const [x, y] = await Promise.all([embed(a), embed(b)]);
  const p = toPct(dot(x, y));
  return d ? Math.min(84, p) : p;
}

/* meaning dictionary: for each envelope word, the words that count as a strong hint for EACH of its meanings (s),

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').trim().replace(/\s+/g, '').toLowerCase();
const THR = 95, MAXP = 10, PREFIX = 'maeul-sim95-';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const CID = (() => {
  let c = null;
  try { c = sessionStorage.getItem('sim95-cid'); } catch(e){}
  if (!c){ c = Math.random().toString(36).slice(2, 12); try { sessionStorage.setItem('sim95-cid', c); } catch(e){} }
  return c;
})();
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = id => document.getElementById(id);

let mode = null;          // null | 'host' | 'guest'
let room = null, peer = null, hostConn = null, conns = {}, retryTimer = null, hostTries = 0;
let V = null;             // the view this device renders
let netStatus = '', entryMsg = '';
let editingGuess = false;

/* ================= host: game state ================= */
let S = null;
function freshRoom(code, hostName){
  return {code, phase:'lobby', players:[{cid:CID, name:hostName, score:0}], shuffle:true, order:[], round:0,
    envelopes:[], envIdx:-1, hidden:'', stage:1, hints:[], attempts:[], passHint:null, hintBusy:false,
    guesses:[], pending:{}, result:null, deltas:{}, msgs:{}};
}
const saveRoom = () => { if (S) store.set('sim95-room-' + S.code, S); };
const setterOf = () => (S.phase === 'lobby' || S.phase === 'final' || S.phase === 'draft') ? -1 : S.order[S.round];
const guessers = () => S.order.filter(i => i !== setterOf());
const online = i => i === 0 || !!(conns[S.players[i].cid] && conns[S.players[i].cid].open);

function viewFor(pid){
  const setter = setterOf();
  const isSetter = pid === setter;
  const end = S.phase === 'round-end';
  return {me:pid, isHost:pid === 0, code:S.code, phase:S.phase, shuffle:S.shuffle,
    players:S.players.map((p, i) => ({name:p.name, score:p.score, online:online(i)})),
    order:S.order, round:S.round, setter, envelopes:S.envelopes.map(e => ({taken:e.owner >= 0, mine:e.owner === pid})), envIdx:S.envIdx,
    myPick:S.picks && S.picks[pid] ? {env:S.picks[pid].env, word:S.picks[pid].word, words:S.envelopes[S.picks[pid].env].words} : null,
    drafted:S.picks ? Object.keys(S.picks).filter(k => S.picks[k].word).map(Number) : [],
    stage:S.stage, hints:S.hints, guesses:S.guesses, submitted:Object.keys(S.pending).map(Number),
    attempts:S.attempts || [], autoIn:S.autoAt ? Math.max(0, S.autoAt - Date.now()) : 0, hintBusy:S.hintBusy, result:S.result, deltas:S.deltas, msg:S.msgs[pid] || '',
    engine:{ready:engine.ready, pct:engine.pct, failed:engine.failed, api:engine.api},
    myGuess:S.pending[pid] ?? null,
    secret:isSetter && !end ? {hidden:S.hidden} : null,
    reveal:end ? {hidden:S.hidden, words:(S.envelopes[S.envIdx] || {}).words || []} : null};
}
let autoTimer = null, autoKey = '';
function scheduleAuto(){
  const key = (S.phase === 'stage-result' || S.phase === 'round-end') ? S.phase + S.round + '-' + S.stage : '';
  if (key === autoKey) return;
  clearTimeout(autoTimer); autoKey = key; S.autoAt = 0;
  if (!key) return;
  const ms = S.phase === 'stage-result' ? 8000 : 12000;
  S.autoAt = Date.now() + ms;
  autoTimer = setTimeout(() => { if (autoKey === key) handle(0, {a:'next'}); }, ms);
}
function push(){
  if (mode !== 'host' || !S) return;
  scheduleAuto();
  saveRoom();
  S.players.forEach((p, i) => { if (i === 0) return; const c = conns[p.cid]; if (c && c.open) sendTo(c, {t:'view', v:viewFor(i)}); });
  V = viewFor(0); render();
}
function startGame(){
  if (S.players.length < 2){ S.msgs[0] = '최소 2명이 필요해요.'; return; }
  S.players.forEach(p => p.score = 0);
  S.order = S.players.map((_, i) => i);
  if (S.shuffle) shuffle(S.order);
  const pool = shuffle([...NOUNS]);
  S.envelopes = S.players.map((_, i) => ({words:pool.slice(i * 5, i * 5 + 5), owner:-1}));
  S.picks = {};
  S.round = 0;
  Object.assign(S, {phase:'draft', envIdx:-1, hidden:'', stage:1, hints:[], attempts:[], passHint:null, hintBusy:false,
    guesses:[], pending:{}, result:null, deltas:{}, msgs:{}});
}
const draftDone = () => S.players.every((_, i) => S.picks[i] && S.picks[i].word);
function beginRound(){
  const pick = S.picks[S.order[S.round]];
  Object.assign(S, {phase:'hint', envIdx:pick.env, hidden:pick.word, stage:1, hints:[], attempts:[], passHint:null, hintBusy:false,
    guesses:[], pending:{}, result:null, deltas:{}, msgs:{}});
}
function forceDraft(){
  S.players.forEach((_, i) => {
    if (!S.picks[i]){ const free = S.envelopes.findIndex(e => e.owner < 0); S.envelopes[free].owner = i; S.picks[i] = {env:free, word:null}; }
    if (!S.picks[i].word){ const ws = S.envelopes[S.picks[i].env].words; S.picks[i].word = ws[Math.floor(Math.random() * ws.length)]; }
  });
  S.round = 0; beginRound();
}
async function tryHint(pid, h){
  h = h.trim().slice(0, 30);
  const a = norm(h), b = norm(S.hidden);
  if (!a){ S.msgs[pid] = '힌트 단어를 입력해 주세요.'; return push(); }
  if (a === b || a.includes(b)){ S.msgs[pid] = '정답 단어와 같거나 정답이 들어간 힌트는 쓸 수 없어요.'; return push(); }
  if (S.hints.some(x => norm(x.text) === a)){ S.msgs[pid] = '이미 공개한 힌트예요.'; return push(); }
  if (S.attempts.some(x => x.stage === S.stage && norm(x.text) === a)){ S.msgs[pid] = '이번 단계에서 이미 시도한 단어예요.'; return push(); }
  S.hintBusy = true; push();
  try {
    const sc = await similarity(S.hidden, h);
    S.attempts.push({text:h, score:sc, stage:S.stage});
    if (sc >= THR){ S.hints.push({text:h, score:sc, stage:S.stage}); S.pending = {}; S.phase = 'guess'; }
    else if (S.attempts.filter(x => x.stage === S.stage).length >= AUTO_AFTER) await autoHint();
  } catch(e){ S.msgs[pid] = '방장 기기에서 유사도 모델을 불러오지 못했어요. 방장의 인터넷 연결을 확인해 주세요.'; }
  S.hintBusy = false; push();
}
async function autoHint(){
  const used = new Set([...S.hints, ...S.attempts].map(x => norm(x.text)));
  let pick = (AUTO_HINTS[S.hidden] || []).find(c => !used.has(norm(c)) && !norm(c).includes(norm(S.hidden)));
  let sc;
  if (pick) sc = await similarity(S.hidden, pick);
  else { const best = S.attempts.filter(a => a.stage === S.stage).sort((a, b) => b.score - a.score)[0]; pick = best.text; sc = best.score; }
  S.hints.push({text:pick, score:sc, stage:S.stage, auto:true}); S.pending = {}; S.phase = 'guess';
}
async function judge(){
  S.phase = 'judging'; push();
  const list = [];
  for (const [k, w] of Object.entries(S.pending)){
    list.push({player:+k, word:w, stage:S.stage, correct:norm(w) === norm(S.hidden)});
  }
  S.guesses.push(...list); S.pending = {};
  const pts = S.stage;
  const winners = [...new Set(list.filter(g => g.correct).map(g => g.player))];
  if (winners.length){
    winners.forEach(p => { S.players[p].score += pts; S.deltas[p] = (S.deltas[p] || 0) + pts; });
    S.result = {type:'hit', winners, stage:S.stage, pts};
    S.phase = 'round-end';
  } else {
    const s = setterOf();
    S.players[s].score += pts; S.deltas[s] = (S.deltas[s] || 0) + pts;
    if (S.stage < 3){ S.result = {type:'stage-miss', stage:S.stage, pts}; S.phase = 'stage-result'; }
    else { S.result = {type:'miss', stage:3}; S.phase = 'round-end'; }
  }
  push();
}
function handle(pid, a){
  if (!S || !a) return;
  S.msgs[pid] = '';
  const setter = setterOf();
  switch (a.a){
    case 'start': if (pid === 0 && S.phase === 'lobby') startGame(); break;
    case 'shuffle': if (pid === 0 && S.phase === 'lobby') S.shuffle = !!a.v; break;
    case 'kick':
      if (pid === 0 && S.phase === 'lobby' && a.i > 0 && S.players[a.i]){
        const p = S.players.splice(a.i, 1)[0]; const c = conns[p.cid];
        if (c){ sendTo(c, {t:'reject', reason:'방장이 방에서 내보냈어요.'}); setTimeout(() => { try { c.close(); } catch(e){} }, 300); delete conns[p.cid]; }
      } break;
    case 'env':
      if (S.phase === 'draft' && !S.picks[pid] && S.envelopes[a.i] && S.envelopes[a.i].owner < 0){
        S.envelopes[a.i].owner = pid; S.picks[pid] = {env:+a.i, word:null};
      } break;
    case 'word':
      if (S.phase === 'draft' && S.picks[pid] && S.envelopes[S.picks[pid].env].words.includes(a.w)){
        S.picks[pid].word = a.w;
        if (draftDone()){ S.round = 0; beginRound(); }
      } break;
    case 'forceDraft': if (pid === 0 && S.phase === 'draft') forceDraft(); break;
    case 'hint': if (S.phase === 'hint' && pid === setter && !S.hintBusy) return tryHint(pid, String(a.text || '')); break;
    case 'guess':
      if (S.phase === 'guess' && pid !== setter && S.order.includes(pid)){
        const w = String(a.w || '').trim().slice(0, 20);
        if (!w){ S.msgs[pid] = '단어를 입력해 주세요.'; break; }
        S.pending[pid] = w;
        if (guessers().every(g => g in S.pending)) return judge();
      } break;
    case 'force': if (pid === 0 && S.phase === 'guess' && Object.keys(S.pending).length) return judge(); break;
    case 'next':
      if (pid !== 0) break;
      if (S.phase === 'stage-result'){ S.stage++; S.phase = 'hint'; S.result = null; }
      else if (S.phase === 'round-end'){ S.round++; if (S.round >= S.players.length) S.phase = 'final'; else beginRound(); }
      break;
    case 'again': if (pid === 0 && S.phase === 'final') startGame(); break;
    case 'lobby':
      if (pid === 0){
        Object.assign(S, {phase:'lobby', envelopes:[], picks:{}, envIdx:-1, hidden:'', hints:[], attempts:[], passHint:null,
          guesses:[], pending:{}, result:null, deltas:{}, msgs:{}});
        S.players.forEach(p => p.score = 0);
      } break;
  }
  push();
}

/* ================= networking (PeerJS, host relays, no accounts) ================= */
function sendTo(c, msg){ if (c && c.open){ try { c.send(msg); } catch(e){} } }
const inviteUrl = code => location.origin + location.pathname + '?room=' + code;
function setUrl(q){ try { history.replaceState(null, '', location.pathname + q); } catch(e){} }
function newCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

function hostWire(c){
  let cid = null;
  c.on('data', msg => {
    if (!msg || !S) return;
    if (msg.t === 'hello'){
      cid = String(msg.cid || '').slice(0, 40);
      let name = String(msg.name || '').trim().slice(0, 12) || '이름없음';
      let i = S.players.findIndex(p => p.cid === cid);
      if (i < 0 && S.phase !== 'lobby'){
        // rejoin from a new tab: take over an offline seat with the same name
        const j = S.players.findIndex((p, k) => k > 0 && p.name === name && !online(k));
        if (j > 0){ S.players[j].cid = cid; i = j; }
      }
      if (i < 0){
        if (S.phase !== 'lobby'){ sendTo(c, {t:'reject', reason:'이미 시작된 게임이에요. 방장이 로비로 돌아오면 참여할 수 있어요.'}); setTimeout(() => c.close(), 400); return; }
        if (S.players.length >= MAXP){ sendTo(c, {t:'reject', reason:'방이 꽉 찼어요 (최대 ' + MAXP + '명).'}); setTimeout(() => c.close(), 400); return; }
        let base = name, k = 2; while (S.players.some(p => p.name === name)) name = base + k++;
        S.players.push({cid, name, score:0});
      } else if (S.phase === 'lobby' && S.players[i].name !== name && !S.players.some(p => p.name === name)) S.players[i].name = name;
      if (conns[cid] && conns[cid] !== c){ try { conns[cid].close(); } catch(e){} }
      conns[cid] = c; push();
    } else if (msg.t === 'act' && cid){
      const i = S.players.findIndex(p => p.cid === cid);
      if (i > 0) handle(i, msg);
    }
  });
  c.on('close', () => { if (cid && conns[cid] === c){ delete conns[cid]; push(); } });
  c.on('error', () => {});
}
function startHost(code, name, existing){
  cleanupNet();
  mode = 'host'; room = code;
  S = existing || store.get('sim95-room-' + code) || freshRoom(code, name);
  S.players[0].cid = CID; S.hintBusy = false;
  if (S.phase === 'judging') S.phase = 'guess';
  setUrl('?host=' + code);
  netStatus = '방을 여는 중…';
  push();
  if (SIM_API) apiCheck(); else loadEngine().catch(() => {});
  if (!window.Peer){ netStatus = '연결 도구를 불러오지 못했어요. 인터넷을 확인하고 새로고침해 주세요.'; return render(); }
  peer = new Peer(PREFIX + code);
  peer.on('open', () => { hostTries = 0; netStatus = ''; render(); });
  peer.on('connection', c => hostWire(c));
  peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} });
  peer.on('error', err => {
    if (err.type === 'unavailable-id'){
      if (++hostTries <= 6){ const p = peer; netStatus = '방을 다시 여는 중…'; render(); setTimeout(() => { if (peer === p && mode === 'host'){ try { p.destroy(); } catch(e){} startHost(code, name, S); } }, 3000); }
      else { netStatus = '이 방 코드를 다른 창에서 쓰고 있어요. 그 창을 닫거나 새 방을 만들어 주세요.'; render(); }
    } else if (['network', 'server-error', 'socket-error'].includes(err.type)){ netStatus = '연결 서버에 닿지 못했어요. 인터넷을 확인하고 새로고침해 주세요.'; render(); }
  });
}
function startGuest(code, name){
  cleanupNet();
  mode = 'guest'; room = code; V = null;
  store.set('sim95-name', name);
  window.__guestName = name;
  setUrl('?room=' + code);
  netStatus = '방 ' + code + '에 연결하는 중…';
  render();
  if (!window.Peer){ netStatus = '연결 도구를 불러오지 못했어요. 인터넷을 확인하고 새로고침해 주세요.'; return render(); }
  peer = new Peer();
  peer.on('open', () => connectGuest());
  peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} });
  peer.on('error', err => {
    if (err.type === 'peer-unavailable'){ netStatus = '방 ' + code + '을 찾지 못했어요. 코드가 맞는지, 방장이 창을 열어 두었는지 확인해 주세요. 다시 시도하는 중…'; render(); scheduleGuestRetry(); }
    else if (['network', 'server-error', 'socket-error'].includes(err.type)){ netStatus = '연결 서버에 닿지 못했어요. 인터넷을 확인해 주세요. 다시 시도하는 중…'; render(); scheduleGuestRetry(); }
  });
}
function connectGuest(){
  if (mode !== 'guest' || !peer || peer.destroyed) return;
  if (hostConn){ try { hostConn.close(); } catch(e){} }
  const c = peer.connect(PREFIX + room, {reliable:true}); hostConn = c;
  c.on('open', () => { clearTimeout(retryTimer); netStatus = ''; sendTo(c, {t:'hello', cid:CID, name:window.__guestName}); render(); });
  c.on('data', msg => {
    if (!msg) return;
    if (msg.t === 'view'){ V = msg.v; netStatus = ''; render(); }
    else if (msg.t === 'reject'){ cleanupNet(); mode = null; V = null; entryMsg = msg.reason; setUrl(''); render(); }
  });
  c.on('close', () => { if (hostConn === c && mode === 'guest'){ netStatus = '방장과 연결이 끊겼어요. 다시 연결하는 중…'; render(); scheduleGuestRetry(); } });
  c.on('error', () => {});
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (mode === 'guest' && !(hostConn && hostConn.open)) scheduleGuestRetry(); }, 8000);
}
function scheduleGuestRetry(){
  if (mode !== 'guest') return;
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connectGuest, 3000);
}
function cleanupNet(){
  clearTimeout(retryTimer);
  if (hostConn){ try { hostConn.close(); } catch(e){} hostConn = null; }
  for (const k in conns){ try { conns[k].close(); } catch(e){} } conns = {};
  if (peer){ try { peer.destroy(); } catch(e){} peer = null; }
}
function act(a){
  if (mode === 'host') handle(0, a);
  else if (mode === 'guest') sendTo(hostConn, {t:'act', ...a});
}

/* ================= views ================= */
const nm = i => V.players[i] ? V.players[i].name : '';
const isSetter = () => V.me === V.setter;
function rulesTable(){
  return `<table class="rules">
  <tr><td>1차 힌트에서 정답 → 맞힌 사람마다</td><td>+1</td></tr>
  <tr><td>1차 힌트에서 아무도 못 맞힘 → 출제자</td><td>+1</td></tr>
  <tr><td>2차 힌트에서 정답 → 맞힌 사람마다</td><td>+2</td></tr>
  <tr><td>2차 힌트에서 아무도 못 맞힘 → 출제자</td><td>+2</td></tr>
  <tr><td>3차 힌트에서 정답 → 맞힌 사람마다</td><td>+3</td></tr>
  <tr><td>3차 힌트에서 아무도 못 맞힘 → 출제자</td><td>+3</td></tr></table>
  <p class="muted" style="margin-top:8px;font-size:13px">출제자 점수는 단계마다 쌓여요. 3차까지 버티면 1+2+3 = 6점.</p>`;
}
function meter(sc){
  const cls = sc >= THR ? 'hit' : sc >= 80 ? 'warm' : '';
  return `<div class="meter" role="img" aria-label="유사도 ${sc}%"><i class="${cls}" style="width:${sc}%"></i><em style="left:${THR}%"></em></div>`;
}
function guessTable(list){
  if (!list.length) return '';
  const rows = [...list].sort((a, b) => (b.correct - a.correct) || (b.stage - a.stage)).map(g =>
    `<tr><td>${esc(g.word)}</td>
      <td class="muted" style="white-space:nowrap">${esc(nm(g.player))} · ${g.stage}차</td>
      <td style="text-align:right">${g.correct ? '<span class="badge">정답</span>' : '<span class="muted">오답</span>'}</td></tr>`).join('');
  return `<div class="tablebox"><table><tr><th>추측 단어</th><th>누가</th><th style="text-align:right">결과</th></tr>${rows}</table></div>`;
}
function hintChips(){
  if (!V.hints.length) return '';
  return `<h3>공개된 힌트</h3><div class="hints">${V.hints.map(h => `<span class="hint"><small>${h.stage}차${h.auto ? ' · 자동' : ''} · ${h.score}%</small>${esc(h.text)}</span>`).join('')}</div>`;
}
function steps(){
  let html = '<div class="steps" aria-label="힌트 단계">';
  for (let i = 1; i <= 3; i++){
    const g = V.guesses.filter(x => x.stage === i);
    let c = '';
    if (g.length) c = g.some(x => x.correct) ? 'hit' : 'miss';
    else if (i === V.stage) c = 'on';
    html += `<span class="${c}"></span>`;
  }
  return html + '</div>';
}
const roundHead = () => `<div class="eyebrow">1라운드 · ${V.round + 1}번째 출제 / ${V.players.length} · 출제자 ${esc(nm(V.setter))}${isSetter() ? ' (나)' : ''}</div>`;
const msgBox = () => V.msg ? `<div class="msg">${esc(V.msg)}</div>` : '';
const hostOnlyNext = label => `<p class="muted" style="margin-top:14px"><span class="countdown" data-until="${Date.now() + (V.autoIn || 0)}">${Math.ceil((V.autoIn || 0) / 1000)}</span>초 뒤 자동으로 ${label}</p>${V.isHost ? `<form data-form="noop"><button class="ghost small" type="submit" data-act="next">바로 넘기기</button></form>` : ''}`;
function loadBox(){
  const e = V.engine;
  if (e.ready) return `<div class="load">${e.api ? 'Gemini 유사도 연결됨' : '유사도 모델 준비 완료'}</div>`;
  if (e.failed) return `<div class="load">방장 기기에서 유사도 모델을 불러오지 못했어요.${V.isHost ? ' <button class="small" data-act="reloadEngine">다시 불러오기</button>' : ''}</div>`;

function tryHistory(title){
  if (!V.attempts.length) return '';
  let html = `<h3>${title}</h3>`;
  for (let st = V.stage; st >= 1; st--){
    const list = V.attempts.filter(a => a.stage === st);
    if (!list.length) continue;
    const rows = [...list].reverse().map(a => `<tr><td>${esc(a.text)}${a.score >= THR ? '<span class="badge">통과</span>' : ''}</td><td style="width:45%">${meter(a.score)}</td><td class="num">${a.score}%</td></tr>`).join('');
    html += `<p class="eyebrow" style="margin:10px 0 2px">${st}차 힌트 시도 ${list.length}번</p><div class="tablebox"><table>${rows}</table></div>`;
  }
  return html;
}

    ${hintChips()}${tryHistory('출제자가 시도한 힌트 후보') || '<p class="muted" style="text-align:center">아직 시도한 단어가 없어요.</p>'}

const views = {lobby:viewLobby, draft:viewDraft, hint:viewHint, guess:viewGuess,
  judging:viewJudging, 'stage-result':viewStageResult, 'round-end':viewRoundEnd, final:viewFinal};

let lastPhaseKey = '';
function render(){
  // keep what someone is typing when a new view arrives
  const keep = {};
  document.querySelectorAll('#stage input[type=text]').forEach(el => keep[el.id] = el.value);
  const focusId = document.activeElement && document.activeElement.id;
  const phaseKey = V ? V.phase + V.round + V.stage : 'none';
  if (phaseKey !== lastPhaseKey){ editingGuess = false; lastPhaseKey = phaseKey; }

  let main, rail = '';
  if (!mode) main = viewEntry();
  else if (!V) main = viewConnecting();
  else { main = (views[V.phase] || viewLobby)(); rail = viewRail(); }
  $('stage').innerHTML = main;
  $('rail').innerHTML = rail;
  $('rail').hidden = !rail;
  $('wrap').classList.toggle('solo', !rail);
  for (const id in keep){ const el = $(id); if (el && !el.readOnly && !el.value && keep[id]) el.value = keep[id]; }
  if (focusId){ const el = $(focusId); if (el && !el.disabled) el.focus(); }
}

/* ================= input ================= */
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  const btn = e.submitter && e.submitter.dataset.act;
  const val = id => { const el = $(id); const v = el ? el.value : ''; if (el && el.type === 'text') el.value = ''; return v; };
  if (f === 'host'){
    const name = $('hostName').value.trim();
    if (!name){ entryMsg = '이름을 적어 주세요.'; return render(); }
    store.set('sim95-name', name); entryMsg = '';
    startHost(newCode(), name);
  } else if (f === 'join' || f === 'joinMain'){
    const code = (f === 'join' ? $('joinCode').value : $('mainCode').value).toUpperCase().replace(/[^A-Z]/g, '');
    const name = (f === 'join' ? $('joinName').value : $('mainName').value).trim();
    if (code.length !== 4){ entryMsg = '방 코드 4글자를 확인해 주세요.'; return render(); }
    if (!name){ entryMsg = '이름을 적어 주세요.'; return render(); }
    entryMsg = '';
    startGuest(code, name);
  } else if (f === 'hint'){ if (!(V && V.hintBusy)) act({a:'hint', text:val('hintIn')}); }
  else if (f === 'guess'){ const w = val('guessIn'); if (w.trim()){ editingGuess = false; act({a:'guess', w}); } }
  else if (btn) doAct(btn);
});
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b || (b.type === 'submit' && b.closest('form'))) return;
  doAct(b.dataset.act, b.dataset.i, b.dataset.w, b);
});
document.addEventListener('change', e => {
  if (e.target.id === 'optShuffle') act({a:'shuffle', v:e.target.checked});
});
function doAct(a, i, w, btn){
  if (a === 'env') act({a:'env', i:+i});
  else if (a === 'word') act({a:'word', w});
  else if (a === 'kick') act({a:'kick', i:+i});
  else if (a === 'askGive'){ const g = $('giveBox'); if (g) g.hidden = !g.hidden; }
  else if (a === 'askReset'){ const r = $('resetBox'); if (r) r.hidden = !r.hidden; }
  else if (a === 'editGuess'){ editingGuess = true; render(); }
  else if (a === 'reloadEngine'){ loadEngine().catch(() => {}); push(); }
  else if (a === 'copy'){
    const el = $('inviteLink');
    const done = () => { if (btn) btn.textContent = '복사됨'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(done, () => { el.select(); });
    else el.select();
  }
  else if (a === 'leave' || a === 'closeRoom' || a === 'toMain'){
    if (a === 'closeRoom' && S) { try { localStorage.removeItem('sim95-room-' + S.code); } catch(e){} }
    cleanupNet(); mode = null; V = null; S = null; netStatus = ''; entryMsg = ''; setUrl(''); render();
  }
  else act({a});
}

setInterval(() => document.querySelectorAll('.countdown').forEach(el => { el.textContent = Math.max(0, Math.ceil((+el.dataset.until - Date.now()) / 1000)); }), 500);

/* ================= boot ================= */
{
  const q = new URLSearchParams(location.search);
  const hostCode = (q.get('host') || '').toUpperCase().replace(/[^A-Z]/g, '');
  const saved = hostCode && store.get('sim95-room-' + hostCode);
  if (saved) startHost(hostCode, saved.players[0].name, saved);
  else { if (hostCode) setUrl(''); render(); }
}
</script>
</body>
